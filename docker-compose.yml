# Vyse — local development stack
# Usage:   docker compose up --build
# Services:
#   backend     FastAPI + agents (port 8000)
#   dashboard   Next.js (port 3000)
#   postgres    DB (port 5432)
#   adminer     DB inspector (port 8080)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyse
      POSTGRES_USER: vyse
      POSTGRES_PASSWORD: vyse
    ports:
      - "5432:5432"
    volumes:
      - vyse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyse -d vyse"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VYSE_ENV: dev
      VYSE_DB_URL: postgresql+asyncpg://vyse:vyse@postgres:5432/vyse
      VYSE_API_HOST: 0.0.0.0
      VYSE_API_PORT: "8000"
      VYSE_LOG_LEVEL: INFO
      VYSE_LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ./snapshots:/app/snapshots
    # Uncomment for NVIDIA GPU access:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"

volumes:
  vyse_pgdata:
